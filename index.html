<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy Proxy</title>
    <style>
        body {
            margin: 0;
            background: #0d1b2a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .nav {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            width: 80%;
            justify-content: space-between;
        }
        .search-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            width: 50%;
            text-align: center;
        }
        .search-box input {
            width: 90%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        .footer {
            position: absolute;
            bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <h2>🚀 Fuzzy Proxy</h2>
        <div>
            <button>Settings</button>
        </div>
    </div>
    <div class="search-box">
        <input type="text" placeholder="🔍 Type URL or search query">
    </div>
    <div class="footer">Site Info</div>
</body>
</html>
